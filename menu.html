<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee-House</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/svg/logo.svg">
    <script src="./js/theme-init.js"></script>
    <link rel="stylesheet" href="/src/scss/style.scss">
  </head>
    <body>
      <header>
      <div class="container">
        <div class="header__container">
          <a href="index.html" class="logo">
            <img src="./src/assets/svg/logo.svg" alt="logo">
          </a>
          <nav class="header__nav nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a href="index.html#favourites" class="nav__link">
                  Favorite coffee
                </a>
              </li>
              <li class="nav__item">
                <a href="index.html#about" class="nav__link">
                  About
                </a>
              </li>
              <li class="nav__item">
                <a href="index.html#mobile" class="nav__link">
                  Mobile app
                </a>
              </li>
              <li class="nav__item">
                <a href="#contacts" class="nav__link">
                  Contact us
                </a>
              </li>
            </ul>
          </nav>
          <div class="header__actions">
            <div class="header__switch-theme switch-theme">
              <button class="switch-theme__button switch-theme__button--light active" data-theme="light">
                <svg class="switch-theme__icon-light">
                  <use href="./spritemap.svg#Sun"></use>
                </svg>
              </button>
              <button class="switch-theme__button switch-theme__button--dark" data-theme="dark">
                <svg class="switch-theme__icon-dark">
                  <use href="./spritemap.svg#Moon"></use>
                </svg>
              </button>
            </div>
            <button type="button" class="burger" aria-label="Open menu">
              <span class="burger__line"></span>
              <span class="burger__line"></span>
            </button>
            <div class="header__coffee-menu">
              <a href="#" class="header__coffee-menu-link header__coffee-menu-link--disabled">
                <span>Menu</span>
                <svg class="header__coffee-menu--icon">
                  <use href="./spritemap.svg#coffee-cup"></use>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
      <main>
        <section class="menu">
          <div class="container">
            <div class="menu__container">
              <h1 class="menu__visability">Coffee House Menu</h1>
              <h2 class="menu__title">Behind each of our cups hides an <span class="menu__word">amazing surprise</span></h2>
              <div class="menu__tabs tabs">
                <button type="button" class="tabs__button tabs__button--active" data-category="coffee">
                  <span class="tabs__icon">☕</span>
                  <span class="tabs__text">Coffee</span>
                </button>
                <button type="button" class="tabs__button" data-category="tea">
                  <span class="tabs__icon">🫖</span>
                  <span class="tabs__text">Tea</span>
                </button>
                <button type="button" class="tabs__button" data-category="dessert">
                  <span class="tabs__icon">🍰</span>
                  <span class="tabs__text">Dessert</span>
                </button>
              </div>
              <ul class="card menu__list card__list"></ul>
              <button type="button" class="menu__refresh">
                <svg class="menu__icon">
                    <use href="./spritemap.svg#refresh"></use>
                </svg>
              </button>
            </div>
          </div>
        </section>
      </main>  
      <footer class="footer" id="contacts">
        <div class="container">
          <div class="footer__container">
            <div class="footer__content footer__left-content">
              <h2 class="footer__title">Sip, Savor, Smile. <span class="footer__word">It’s coffee time!</span></h2>
              <div class="footer__social social">
                <ul class="social__list">
                  <li class="social__item">
                    <a href="#" class="social__link">
                      <svg class="social__image">
                        <use href="./spritemap.svg#twitter"></use>
                      </svg>
                    </a>
                  </li>
                  <li class="social__item">
                    <a href="#" class="social__link">
                      <svg class="social__image">
                        <use href="./spritemap.svg#instagram"></use>
                      </svg>
                    </a>
                  </li>
                  <li class="social__item">
                    <a href="#" class="social__link">
                      <svg class="social__image">
                        <use href="./spritemap.svg#facebook"></use>
                      </svg>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
            <div class="footer__content footer__right-content contacts">
              <h3 class="contacts__title">Contact us</h3>
                <ul class="contacts__list">
                  <li class="contacts__item">
                    <a 
                      href="https://maps.google.com/?q=8558+Green+Rd.,+LA" 
                      target="_blank"
                      class="contacts__link"
                    >
                      <svg class="contacts__icon">
                        <use href="./spritemap.svg#pin-alt"></use>
                      </svg>
                      <span>8558 Green Rd., LA</span>
                    </a>
                  </li>
                  <li class="contacts__item">
                    <a href="tel:+16035550123" class="contacts__link">
                      <svg class="contacts__icon">
                        <use href="./spritemap.svg#phone"></use>
                      </svg>
                      <span>+1 (603) 555-0123</span>
                    </a>
                  </li>
                  <li class="contacts__item">
                    <div class="contacts__info">
                      <svg class="contacts__icon">
                        <use href="./spritemap.svg#clock"></use>
                      </svg>
                      <span>Mon–Sat: 9:00–23:00</span>
                    </div>
                  </li>
                </ul>
            </div>
          </div>
        </div>
      </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
